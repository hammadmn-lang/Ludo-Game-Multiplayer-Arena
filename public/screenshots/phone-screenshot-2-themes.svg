<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGrad)" />

  <!-- Phone Bezel Frame -->
  <rect x="60" y="80" width="960" height="1760" rx="64" fill="#020617" stroke="#334155" stroke-width="8" filter="url(#shadow)" />
  <rect x="76" y="96" width="928" height="1728" rx="52" fill="#0b0f19" />

  <!-- Dynamic Island / Speaker notch -->
  <rect x="420" y="112" width="240" height="34" rx="17" fill="#000000" />
  <circle cx="620" cy="129" r="6" fill="#1e293b" />

  <!-- Status Bar -->
  <text x="120" y="136" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="24">9:41</text>
  <text x="910" y="136" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="22">5G 100%</text>

  <!-- App Header -->
  <rect x="96" y="180" width="888" height="110" rx="24" fill="#1e293b" opacity="0.7" />
  <text x="140" y="248" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="38">🎨 THEMES &amp; SKINS STUDIO</text>
  <rect x="830" y="210" width="120" height="50" rx="16" fill="#4f46e5" />
  <text x="862" y="242" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="20">VIP</text>

  <!-- Title Banner -->
  <text x="140" y="340" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="44">CUSTOMIZE YOUR ARENA</text>
  <text x="140" y="380" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="24">Collect exclusive board materials, animated dice &amp; custom tokens</text>

  <!-- Theme Card 1: Royal Gold -->
  <rect x="120" y="420" width="840" height="260" rx="32" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)" />
  <rect x="150" y="450" width="200" height="200" rx="24" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
  <circle cx="250" cy="550" r="60" fill="url(#goldGrad)" />
  <text x="250" y="565" fill="#ffffff" font-size="48" font-family="sans-serif" text-anchor="middle">👑</text>
  <text x="380" y="500" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="34">ROYAL GOLD CHAMPION</text>
  <text x="380" y="540" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="22">Luxurious obsidian board with metallic 24K gold accents</text>
  <rect x="380" y="580" width="160" height="48" rx="16" fill="#f59e0b" />
  <text x="415" y="612" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="20">EQUIPPED</text>

  <!-- Theme Card 2: Cyber Neon -->
  <rect x="120" y="710" width="840" height="260" rx="32" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)" />
  <rect x="150" y="740" width="200" height="200" rx="24" fill="#083344" stroke="#06b6d4" stroke-width="2" />
  <circle cx="250" cy="840" r="60" fill="url(#neonGrad)" />
  <text x="250" y="855" fill="#ffffff" font-size="48" font-family="sans-serif" text-anchor="middle">⚡</text>
  <text x="380" y="790" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="34">CYBER NEON 2077</text>
  <text x="380" y="830" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="22">Holographic grid with dynamic laser neon reflections</text>
  <rect x="380" y="870" width="160" height="48" rx="16" fill="#0891b2" />
  <text x="425" y="902" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20">SELECT</text>

  <!-- Theme Card 3: Classic Wooden -->
  <rect x="120" y="1000" width="840" height="260" rx="32" fill="url(#cardGrad)" stroke="#78350f" stroke-width="2" filter="url(#shadow)" />
  <rect x="150" y="1030" width="200" height="200" rx="24" fill="#451a03" stroke="#b45309" stroke-width="2" />
  <circle cx="250" cy="1130" r="60" fill="#92400e" />
  <text x="250" y="1145" fill="#ffffff" font-size="48" font-family="sans-serif" text-anchor="middle">🪵</text>
  <text x="380" y="1080" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="34">HERITAGE TEAK WOOD</text>
  <text x="380" y="1120" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="22">Hand-carved premium timber with warm vintage dice</text>
  <rect x="380" y="1160" width="160" height="48" rx="16" fill="#78350f" />
  <text x="425" y="1192" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20">SELECT</text>

  <!-- Custom Dice & Token Carousel -->
  <text x="140" y="1320" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="34">DICE &amp; TOKEN STYLES</text>

  <rect x="120" y="1350" width="260" height="260" rx="28" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <text x="250" y="1460" font-size="64" text-anchor="middle">🎲</text>
  <text x="250" y="1540" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="24" text-anchor="middle">Ruby Crystal</text>
  <text x="250" y="1575" fill="#818cf8" font-family="sans-serif" font-weight="600" font-size="18" text-anchor="middle">3D Glow Physics</text>

  <rect x="410" y="1350" width="260" height="260" rx="28" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="540" y="1460" font-size="64" text-anchor="middle">🛡️</text>
  <text x="540" y="1540" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="24" text-anchor="middle">Knight Shields</text>
  <text x="540" y="1575" fill="#34d399" font-family="sans-serif" font-weight="600" font-size="18" text-anchor="middle">Aura Shield Token</text>

  <rect x="700" y="1350" width="260" height="260" rx="28" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
  <text x="830" y="1460" font-size="64" text-anchor="middle">✨</text>
  <text x="830" y="1540" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="24" text-anchor="middle">Cosmic Star</text>
  <text x="830" y="1575" fill="#f472b6" font-family="sans-serif" font-weight="600" font-size="18" text-anchor="middle">Particle Trail</text>

  <!-- Bottom CTA -->
  <rect x="120" y="1650" width="840" height="96" rx="28" fill="url(#goldGrad)" filter="url(#shadow)" />
  <text x="540" y="1710" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="34" text-anchor="middle">UNLOCK ALL SKINS IN ARENA</text>
</svg>
