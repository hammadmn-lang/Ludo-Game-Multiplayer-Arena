<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#gBg)" />

  <!-- Phone Frame -->
  <rect x="60" y="80" width="960" height="1760" rx="64" fill="#020617" stroke="#334155" stroke-width="8" />
  <rect x="76" y="96" width="928" height="1728" rx="52" fill="#0b0f19" />

  <!-- Notch -->
  <rect x="420" y="112" width="240" height="34" rx="17" fill="#000000" />
  <circle cx="620" cy="129" r="6" fill="#1e293b" />

  <!-- Status Bar -->
  <text x="120" y="136" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="24">10:42</text>
  <text x="910" y="136" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="22">5G 98%</text>

  <!-- In-Game Match Header -->
  <rect x="120" y="170" width="840" height="110" rx="28" fill="#1e293b" />
  <text x="160" y="235" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="32">🏆 CHAMPIONSHIP ROOM #7291</text>
  <rect x="740" y="195" width="190" height="60" rx="20" fill="#dc2626" />
  <text x="790" y="234" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="22">LIVE • 4P</text>

  <!-- Player 1 & 2 Cards -->
  <g transform="translate(120, 310)">
    <!-- Red Player -->
    <rect width="400" height="130" rx="24" fill="#7f1d1d" stroke="#ef4444" stroke-width="3" filter="url(#glow)" />
    <circle cx="65" cy="65" r="40" fill="#ef4444" />
    <text x="65" y="75" font-size="34" text-anchor="middle">🦁</text>
    <text x="125" y="55" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="26">Alex (You)</text>
    <text x="125" y="90" fill="#fca5a5" font-family="sans-serif" font-weight="600" font-size="20">1,420 Elo • Turn active!</text>
  </g>

  <g transform="translate(560, 310)">
    <!-- Green Player -->
    <rect width="400" height="130" rx="24" fill="#14532d" stroke="#22c55e" stroke-width="2" />
    <circle cx="65" cy="65" r="40" fill="#22c55e" />
    <text x="65" y="75" font-size="34" text-anchor="middle">🐯</text>
    <text x="125" y="55" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="26">Sophia_Pro</text>
    <text x="125" y="90" fill="#86efac" font-family="sans-serif" font-weight="600" font-size="20">1,385 Elo</text>
  </g>

  <!-- Ludo Board Graphic -->
  <g transform="translate(140, 480)">
    <!-- Board Base -->
    <rect width="800" height="800" rx="36" fill="#0f172a" stroke="#334155" stroke-width="6" />
    
    <!-- Quadrants -->
    <rect x="20" y="20" width="300" height="300" rx="20" fill="#ef4444" opacity="0.9" />
    <rect x="480" y="20" width="300" height="300" rx="20" fill="#22c55e" opacity="0.9" />
    <rect x="20" y="480" width="300" height="300" rx="20" fill="#3b82f6" opacity="0.9" />
    <rect x="480" y="480" width="300" height="300" rx="20" fill="#eab308" opacity="0.9" />

    <!-- Center Home -->
    <polygon points="320,320 480,320 400,400" fill="#22c55e" />
    <polygon points="480,320 480,480 400,400" fill="#eab308" />
    <polygon points="480,480 320,480 400,400" fill="#3b82f6" />
    <polygon points="320,480 320,320 400,400" fill="#ef4444" />

    <!-- Tokens in bases -->
    <circle cx="100" cy="100" r="28" fill="#ffffff" stroke="#991b1b" stroke-width="6" />
    <circle cx="240" cy="100" r="28" fill="#ffffff" stroke="#991b1b" stroke-width="6" />
    <circle cx="100" cy="240" r="28" fill="#ffffff" stroke="#991b1b" stroke-width="6" />
    <circle cx="240" cy="240" r="28" fill="#ffffff" stroke="#991b1b" stroke-width="6" />

    <circle cx="560" cy="100" r="28" fill="#ffffff" stroke="#166534" stroke-width="6" />
    <circle cx="700" cy="100" r="28" fill="#ffffff" stroke="#166534" stroke-width="6" />
    <circle cx="560" cy="240" r="28" fill="#ffffff" stroke="#166534" stroke-width="6" />
    <circle cx="700" cy="240" r="28" fill="#ffffff" stroke="#166534" stroke-width="6" />

    <!-- Active moving tokens on path -->
    <circle cx="360" cy="180" r="32" fill="#ef4444" stroke="#ffffff" stroke-width="5" filter="url(#glow)" />
    <circle cx="440" cy="220" r="32" fill="#22c55e" stroke="#ffffff" stroke-width="5" />
    <circle cx="620" cy="440" r="32" fill="#eab308" stroke="#ffffff" stroke-width="5" />
    <circle cx="400" cy="620" r="32" fill="#3b82f6" stroke="#ffffff" stroke-width="5" />

    <!-- Center Trophy in Home -->
    <text x="400" y="420" font-size="44" text-anchor="middle">👑</text>
  </g>

  <!-- Player 3 & 4 Cards -->
  <g transform="translate(120, 1320)">
    <!-- Blue Player -->
    <rect width="400" height="120" rx="24" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <circle cx="60" cy="60" r="36" fill="#3b82f6" />
    <text x="60" y="70" font-size="30" text-anchor="middle">🦅</text>
    <text x="120" y="50" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="24">Lucas_X</text>
    <text x="120" y="80" fill="#93c5fd" font-family="sans-serif" font-weight="600" font-size="18">1,290 Elo</text>
  </g>

  <g transform="translate(560, 1320)">
    <!-- Yellow Player -->
    <rect width="400" height="120" rx="24" fill="#713f12" stroke="#eab308" stroke-width="2" />
    <circle cx="60" cy="60" r="36" fill="#eab308" />
    <text x="60" y="70" font-size="30" text-anchor="middle">🐉</text>
    <text x="120" y="50" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="24">Zack_99</text>
    <text x="120" y="80" fill="#fde047" font-family="sans-serif" font-weight="600" font-size="18">1,310 Elo</text>
  </g>

  <!-- Big Interactive 3D Dice Controller Box -->
  <rect x="120" y="1470" width="840" height="200" rx="36" fill="#1e293b" stroke="#4f46e5" stroke-width="3" />
  
  <!-- 3D Dice -->
  <g transform="translate(240, 1570)">
    <rect x="-65" y="-65" width="130" height="130" rx="26" fill="url(#diceGrad)" stroke="#cbd5e1" stroke-width="5" filter="url(#glow)" />
    <!-- 6 pips -->
    <circle cx="-35" cy="-35" r="11" fill="#dc2626" />
    <circle cx="-35" cy="0" r="11" fill="#dc2626" />
    <circle cx="-35" cy="35" r="11" fill="#dc2626" />
    <circle cx="35" cy="-35" r="11" fill="#dc2626" />
    <circle cx="35" cy="0" r="11" fill="#dc2626" />
    <circle cx="35" cy="35" r="11" fill="#dc2626" />
  </g>

  <text x="360" y="1550" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="36">YOU ROLLED A 6! 🎉</text>
  <text x="360" y="1595" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="24">Tap highlighted token to release from base</text>

  <!-- In-game Chat Emojis bar -->
  <rect x="120" y="1690" width="840" height="90" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <text x="160" y="1748" font-size="40">🔥</text>
  <text x="250" y="1748" font-size="40">😎</text>
  <text x="340" y="1748" font-size="40">👑</text>
  <text x="430" y="1748" font-size="40">⚡</text>
  <text x="520" y="1748" font-size="40">🎲</text>
  <text x="610" y="1748" font-size="40">👏</text>
  <rect x="740" y="1705" width="190" height="60" rx="18" fill="#4f46e5" />
  <text x="795" y="1744" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="22">CHAT</text>
</svg>
