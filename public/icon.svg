<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring / Accent border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.8" />

  <!-- Ludo 4 Quadrants Emblem -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Red Top-Left -->
    <path d="M -160,-160 L -16,-160 A 12,12 0 0,1 -4,-148 L -4,-4 L -148,-4 A 12,12 0 0,1 -160,-16 Z" fill="url(#redGrad)" />
    <!-- Green Top-Right -->
    <path d="M 16,-160 L 160,-160 A 12,12 0 0,1 160,-16 L 4,-4 L 4,-148 A 12,12 0 0,1 16,-160 Z" fill="url(#greenGrad)" />
    <!-- Yellow Bottom-Right -->
    <path d="M 160,16 L 160,160 A 12,12 0 0,1 16,160 L 4,4 L 148,4 A 12,12 0 0,1 160,16 Z" fill="url(#yellowGrad)" />
    <!-- Blue Bottom-Left -->
    <path d="M -16,160 L -160,160 A 12,12 0 0,1 -160,16 L -4,4 L -4,148 A 12,12 0 0,1 -16,160 Z" fill="url(#blueGrad)" />

    <!-- Center Golden Die -->
    <rect x="-56" y="-56" width="112" height="112" rx="24" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4" />
    
    <!-- Die Pips (Six / Crown arrangement) -->
    <circle cx="-26" cy="-26" r="8" fill="#ffffff" />
    <circle cx="26" cy="-26" r="8" fill="#ffffff" />
    <circle cx="-26" cy="0" r="8" fill="#ffffff" />
    <circle cx="26" cy="0" r="8" fill="#ffffff" />
    <circle cx="-26" cy="26" r="8" fill="#ffffff" />
    <circle cx="26" cy="26" r="8" fill="#ffffff" />
  </g>
</svg>
